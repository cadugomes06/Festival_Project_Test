<div class="login-page">
  <form class="login-page__card" [formGroup]="form" (ngSubmit)="submit()">
    <h1 class="login-page__title">Pedidos do festival</h1>
    <p class="login-page__subtitle">Entre para ver a listagem de pedidos.</p>

    <div class="login-page__field">
      <label class="login-page__label" for="email">E-mail</label>
      <input
        class="login-page__input"
        id="email"
        type="email"
        autocomplete="username"
        formControlName="email"
      />
    </div>

    <div class="login-page__field">
      <label class="login-page__label" for="password">Senha</label>
      <input
        class="login-page__input"
        id="password"
        type="password"
        autocomplete="current-password"
        formControlName="password"
      />
    </div>

    @if (error(); as mensagemErro) {
      <app-error-message [message]="mensagemErro" />
    }

    <button class="login-page__button" type="submit" [disabled]="loading()">
      {{ loading() ? 'Entrando...' : 'Entrar' }}
    </button>
  </form>
</div>
